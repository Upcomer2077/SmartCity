name: Sync Docs to GitHub Wiki

on:
  push:
    branches:
      - main
      - dev
      - doc-test
    paths:
      - 'docs/**'

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Push to Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: ./docs
          token: ${{ secrets.GITHUB_TOKEN }} 
